name: Publish Snapshot

# A push to main that changes anything other than top-level Markdown publishes the development
# snapshot, so consumers take each fix as it lands. A dispatch publishes the selected ref on demand.
# Runs queue per ref and are never cancelled mid-deploy: a running publication completes, and while
# it runs only the newest waiting push is kept, so an intermediate push can be superseded.
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    uses: markpollack/build-tools/.github/workflows/publish-snapshot.yml@35297f1ade5f47c2925d6dab42a7e2d43bd734d0
    with:
      java-version: '21'
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
